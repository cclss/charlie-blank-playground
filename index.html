<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="board-wrapper">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div class="side-panel">
      <div class="next-box">
        <span class="label">Next</span>
        <div class="next-canvas-wrapper">
          <canvas id="nextCanvas"></canvas>
        </div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat-item">
          <span class="label">Level</span>
          <span class="value" id="level">0</span>
        </div>
        <div class="stat-item">
          <span class="label">Lines</span>
          <span class="value" id="lines">0</span>
        </div>
      </div>

      <div class="controls">
        <kbd>←</kbd> <kbd>→</kbd> Move<br>
        <kbd>↑</kbd> Rotate<br>
        <kbd>↓</kbd> Soft drop<br>
        <kbd>Space</kbd> Hard drop<br>
        <kbd>Z</kbd> Rotate CCW<br>
        <kbd>P</kbd> Pause<br>
        <kbd>R</kbd> Restart
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>TetrisGame.init('mainCanvas', 'nextCanvas');</script>
</body>
</html>
